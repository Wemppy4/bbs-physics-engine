plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

// The oldest and the newest Minecraft the mod is meant to run on. The jar is compiled against
// the newest one; the pair is what goes both into the jar name and into the manifest's
// dependency range, so those two can never drift apart.
def minecraftRange = ">=${minecraft_version_min} <=${minecraft_version}"
def minecraftLabel = minecraft_version_min == minecraft_version ? minecraft_version : "${minecraft_version_min}-${minecraft_version}"

version = project.mod_version + "-" + minecraftLabel
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// BBS is not published to any repository at all: its jar is kept in `libs/` next to this
	// build, one file per Minecraft version, and `bbs_version` picks which one is used.

	// Where Jolt comes from. Loom brings in the Fabric and Mojang repositories on its own,
	// but not this one.
	mavenCentral()
}

// The platforms the Jolt native library is bundled for. Anything outside this list still runs
// the mod — the addon reports that physics is unavailable and stays out of the way — so the
// list is about who gets physics, not about who can launch.
def joltPlatforms = ["Windows64", "Linux64", "Linux_ARM64", "MacOSX64", "MacOSX_ARM64"]

// The BBS jar this addon is built against. It lives in `libs/` rather than in a repository,
// because BBS is not published to any — the jar is dropped in by hand, one per Minecraft
// version, and `bbs_version` in gradle.properties says which of them is the current one.
def bbsArtifact = file("${projectDir}/libs/bbs-${bbs_version}.jar")

if (!bbsArtifact.isFile()) {
	throw new GradleException("BBS ${bbs_version} is missing: expected ${bbsArtifact}. Drop the jar into libs/ or point bbs_version at one that is there.")
}

// Loom caches remapped mod dependencies, and BBS keeps the same version string while it is
// being developed — so after replacing the jar in place, this project would quietly go on
// compiling against the previous remap. `--refresh-dependencies` clears it, but a flag one has
// to remember is a flag one forgets, and forgetting it here looks like the changes to BBS
// simply not existing. So the stale remap is dropped by the build itself.
def bbsRemaps = file("${projectDir}/.gradle/loom-cache/remapped_mods")

if (bbsRemaps.isDirectory()) {
	bbsRemaps.listFiles().each { remap ->
		if (remap.isDirectory() && fileTree(remap).files.any { it.name.startsWith("bbs-") && it.lastModified() < bbsArtifact.lastModified() }) {
			logger.lifecycle("The BBS jar is newer than its remap — dropping ${remap.name} from Loom's cache.")

			remap.deleteDir()
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bbs_physics" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The mod this one is an addon to. Loom remaps it back to the development mappings and
	// puts it on the run classpath, so `runClient` starts the game with BBS present.
	//
	// It comes in as a plain file rather than through a repository, so nothing transitive
	// rides along — which is what we want anyway: BBS is compiled against Sodium, Iris and
	// the shader tooling, and dragging those into this dev runtime buys nothing but a slower
	// launch and failure modes that have nothing to do with physics.
	modImplementation files(bbsArtifact)

	// Jolt Physics. Every platform artifact of jolt-jni carries the same Java classes, so one
	// of them is taken for the API and the rest contribute nothing but their native library,
	// which sits under a classifier of its own.
	//
	// `ReleaseSp` is single precision: the double-precision build exists for worlds measured in
	// kilometres, while physics here runs in model space around a character, where floats are
	// exact enough and half the memory traffic.
	//
	// All of it rides into the mod jar through Fabric's jar-in-jar — a mod has no other channel
	// to ship a native library through, and asking people to install one by hand is not a channel.
	implementation "com.github.stephengold:jolt-jni-Windows64:${project.jolt_version}"
	include "com.github.stephengold:jolt-jni-Windows64:${project.jolt_version}"

	joltPlatforms.each { platform ->
		def nativeVersion = platform == 'Linux_ARM64' ? project.jolt_linux_arm64_version : project.jolt_version
		runtimeOnly "com.github.stephengold:jolt-jni-${platform}:${nativeVersion}:ReleaseSp"
		include "com.github.stephengold:jolt-jni-${platform}:${nativeVersion}:ReleaseSp"
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_range", minecraftRange

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_range": minecraftRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
	physicsChecks {
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

tasks.register('physicsCacheCheck', JavaExec) {
	dependsOn physicsChecksClasses
	classpath = sourceSets.physicsChecks.runtimeClasspath
	mainClass = 'wemppy.bbs_physics.engine.PhysicsCacheCheck'
}

tasks.register('physicsPoseCheck', JavaExec) {
	dependsOn physicsChecksClasses
	classpath = sourceSets.physicsChecks.runtimeClasspath
	mainClass = 'wemppy.bbs_physics.engine.PoseFrameCheck'
}

tasks.register('physicsSettingsCheck', JavaExec) {
    dependsOn physicsChecksClasses
    classpath = sourceSets.physicsChecks.runtimeClasspath
    mainClass = 'wemppy.bbs_physics.engine.PhysicsSettingsCheck'
}

tasks.named('check') {
	dependsOn 'physicsSpeedCheck'
	dependsOn physicsCacheCheck, physicsPoseCheck, physicsSettingsCheck, physicsSceneCheck, physicsDestructionCheck
}

tasks.register('physicsSpeedCheck', JavaExec) {
    dependsOn physicsChecksClasses
    classpath = sourceSets.physicsChecks.runtimeClasspath
    mainClass = 'wemppy.bbs_physics.client.scene.PhysicsSpeedCheck'
    workingDir layout.buildDirectory.dir('physicsSpeedCheck')
    doFirst { workingDir.mkdirs() }
}

tasks.register('physicsDestructionCheck', JavaExec) {
    dependsOn physicsChecksClasses
    classpath = sourceSets.physicsChecks.runtimeClasspath
    mainClass = 'wemppy.bbs_physics.client.scene.StructureDestructionCheck'
    workingDir layout.buildDirectory.dir('physicsDestructionCheck')
    doFirst { workingDir.mkdirs() }
}

tasks.register('physicsSceneCheck', JavaExec) {
	dependsOn physicsChecksClasses
	classpath = sourceSets.physicsChecks.runtimeClasspath
	mainClass = 'wemppy.bbs_physics.client.scene.PhysicsSceneCheck'
	workingDir layout.buildDirectory.dir('physicsSceneCheck')
	doFirst { workingDir.mkdirs() }
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = project.base.archivesName.get()

			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
