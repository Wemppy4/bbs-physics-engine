plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

// The oldest and the newest Minecraft the mod is meant to run on. The jar is compiled against
// the newest one; the pair is what goes both into the jar name and into the manifest's
// dependency range, so those two can never drift apart.
def minecraftRange = ">=${minecraft_version_min} <=${minecraft_version}"
def minecraftLabel = minecraft_version_min == minecraft_version ? minecraft_version : "${minecraft_version_min}-${minecraft_version}"

version = project.mod_version + "-" + minecraftLabel
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// BBS is not published to any public repository, so it is taken from the local Maven
	// one, which `gradlew publishToMavenLocal` in the bbs-fs checkout fills.
	mavenLocal()

	// Where Jolt comes from. Loom brings in the Fabric and Mojang repositories on its own,
	// but not this one.
	mavenCentral()
}

// The platforms the Jolt native library is bundled for. Anything outside this list still runs
// the mod — the addon reports that physics is unavailable and stays out of the way — so the
// list is about who gets physics, not about who can launch.
def joltPlatforms = ["Windows64", "Linux64", "Linux_ARM64", "MacOSX64", "MacOSX_ARM64"]

// Loom keys its cache of remapped mod dependencies by coordinates, and BBS keeps the same
// version string while it is being developed — so after republishing it, this project would
// quietly go on compiling against the previous remap. `--refresh-dependencies` clears it, but
// a flag one has to remember is a flag one forgets, and forgetting it here looks like the
// changes to BBS simply not existing. So the stale remap is dropped by the build itself.
def bbsArtifact = file("${System.properties['user.home']}/.m2/repository/mchorse/bbs/${bbs_version}/bbs-${bbs_version}.jar")
def bbsRemaps = file("${projectDir}/.gradle/loom-cache/remapped_mods/remapped/mchorse")

if (bbsArtifact.isFile() && bbsRemaps.isDirectory()) {
	bbsRemaps.listFiles().each { remap ->
		if (remap.isDirectory() && fileTree(remap).files.any { it.lastModified() < bbsArtifact.lastModified() }) {
			logger.lifecycle("BBS has been republished since it was last remapped — dropping ${remap.name} from Loom's cache.")

			remap.deleteDir()
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bbs_physics" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The mod this one is an addon to. Loom remaps it back to the development mappings and
	// puts it on the run classpath, so `runClient` starts the game with BBS present.
	//
	// Transitives are off deliberately: BBS's POM carries Sodium, Iris and the shader
	// tooling it compiles against, and dragging those into this dev runtime buys nothing
	// but a slower launch and failure modes that have nothing to do with physics.
	modImplementation("mchorse:bbs:${project.bbs_version}") {
		transitive = false
	}

	// Jolt Physics. Every platform artifact of jolt-jni carries the same Java classes, so one
	// of them is taken for the API and the rest contribute nothing but their native library,
	// which sits under a classifier of its own.
	//
	// `ReleaseSp` is single precision: the double-precision build exists for worlds measured in
	// kilometres, while physics here runs in model space around a character, where floats are
	// exact enough and half the memory traffic.
	//
	// All of it rides into the mod jar through Fabric's jar-in-jar — a mod has no other channel
	// to ship a native library through, and asking people to install one by hand is not a channel.
	implementation "com.github.stephengold:jolt-jni-Windows64:${project.jolt_version}"
	include "com.github.stephengold:jolt-jni-Windows64:${project.jolt_version}"

	joltPlatforms.each { platform ->
		runtimeOnly "com.github.stephengold:jolt-jni-${platform}:${project.jolt_version}:ReleaseSp"
		include "com.github.stephengold:jolt-jni-${platform}:${project.jolt_version}:ReleaseSp"
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_range", minecraftRange

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_range": minecraftRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = project.base.archivesName.get()

			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
