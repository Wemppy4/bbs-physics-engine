plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version + "-" + minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// BBS is not published to any public repository, so it is taken from the local Maven
	// one, which `gradlew publishToMavenLocal` in the bbs-fs checkout fills.
	mavenLocal()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bbs_physics" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The mod this one is an addon to. Loom remaps it back to the development mappings and
	// puts it on the run classpath, so `runClient` starts the game with BBS present.
	//
	// Transitives are off deliberately: BBS's POM carries Sodium, Iris and the shader
	// tooling it compiles against, and dragging those into this dev runtime buys nothing
	// but a slower launch and failure modes that have nothing to do with physics.
	modImplementation("mchorse:bbs:${project.bbs_version}") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = project.base.archivesName.get()

			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
