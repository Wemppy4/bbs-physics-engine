# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# These are kept in lockstep with the BBS build this addon compiles against — the mod
# dependency is remapped with these mappings, so a mismatch breaks the dev environment.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14

# The oldest Minecraft the mod is allowed to load on. It changes nothing about compilation —
# the jar is always built against `minecraft_version` — only the jar name and the dependency
# range written into fabric.mod.json.
minecraft_version_min=1.21.1

# Mod Properties
mod_version=1.0.1-cml
maven_group=wemppy
archives_base_name=bbs_physics

# Dependencies
fabric_version=0.116.12+1.21.1

# The mod this one extends, and the name it is published under. This branch builds against BBS
# CML rather than BBS itself — a different fork of the same mod, with the same mod id (`bbs`) and
# the same package, so the two are never installed together and one addon jar answers to one of
# them. Fill the local Maven repository from the bbs-cml checkout:
#
#   gradlew -I <cml-publish.init.gradle> -Pmaven_group=mchorse publishToMavenLocal
#
# The init script is what makes it publishable at all: CML's own group is a comma-separated list
# of authors and its artifact id defaults to a project name with a space in it.
bbs_artifact=bbs-cml
bbs_version=2.1-ReleaseCandidate-4-1.21.1

# Jolt Physics, through stephengold's JNI bindings — the engine this addon exists to bring
# into BBS. Bumping this changes the native libraries bundled into the mod jar, so it is a
# release-sized decision rather than a routine update.
jolt_version=1.0.0
